name: Verify Windows

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

concurrency:
  group: verify-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Test Core Finance Suite
        run: bun test src/updater.test.ts src/web/data.test.ts src/plugins/builtin/reconciliation/engine.test.ts

      - name: Build standalone CLI
        run: bun run scripts/build.ts

      - name: Verify standalone CLI artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\razor-terminal-windows-x64.exe.gz")) {
            throw "Missing standalone Windows CLI archive"
          }

